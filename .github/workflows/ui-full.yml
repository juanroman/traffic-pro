name: UI tests (full)

# The whole UI suite (40 tests, ~9 minutes locally, much longer on a runner). Manual only:
# Actions tab -> "UI tests (full)" -> Run workflow, or `gh workflow run ui-full.yml`.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XCODE_APP: /Applications/Xcode_27.2.app
  RESULTS_DIR: ${{ github.workspace }}/results

jobs:
  ui:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s "$XCODE_APP"
      - run: ios/check.sh build
      - run: ios/check.sh ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !success() }}
        with:
          name: xcresult
          path: results/
          retention-days: 7
