name: CodeQL

# Advanced setup, replacing GitHub's default setup. It scans the workflow files only (`actions`).
# Swift is deliberately not scanned: CodeQL needs a traced build, and its x86_64 tracer breaks the
# arm64-only tools the build uses on the `xcode-27` runner (`sandbox-exec`, then the Swift macro
# plugin server that expands @Observable). Default setup also failed, on the runner's older Swift
# (6.3; TrafficProKit needs 6.4). Swift has no `build-mode: none`. Revisit if CodeQL's tracer
# gains arm64 support.

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', LICENSE]
  push:
    branches: [main]
    paths-ignore: ['**.md', LICENSE]
  schedule:
    # Weekly, so new queries also run on code that has not changed.
    - cron: '23 5 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:actions
