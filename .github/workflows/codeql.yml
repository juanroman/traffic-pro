name: CodeQL

# Advanced setup, replacing GitHub's default setup. Default setup builds Swift with the runner's
# default Xcode (Swift 6.3), but TrafficProKit needs tools version 6.4, so the build failed.
# Here the Swift job runs on the `xcode-27` image and selects Xcode 27.2 like ci.yml does.
# It uses `build-mode: none` (source extraction, no build) because a traced build fails: the
# tracer is x86_64 and breaks arm64-only tools (`sandbox-exec`, the Swift macro plugin server
# that expands @Observable).

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', LICENSE]
  push:
    branches: [main]
    paths-ignore: ['**.md', LICENSE]
  schedule:
    # Weekly, so new queries also run on code that has not changed.
    - cron: '23 5 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_APP: /Applications/Xcode_27.2.app

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: xcode-27
            build-mode: none
          - language: actions
            runner: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.language == 'swift'
        run: sudo xcode-select -s "$XCODE_APP"
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
