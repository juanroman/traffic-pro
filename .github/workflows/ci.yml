name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Xcode 27.2 and the iOS 27.2 simulator exist only on the `xcode-27` runner image
  # (its default Xcode is 27.1, so each job selects 27.2).
  XCODE_APP: /Applications/Xcode_27.2.app
  RESULTS_DIR: ${{ github.workspace }}/results

jobs:
  # A PR or a push to main that only touches Markdown or the license skips the slow jobs
  # (package tests, app). Skipped jobs still report as passed to the required checks on main,
  # which a workflow-level `paths-ignore` would not do (the PR would wait forever). Lint always
  # runs: it is cheap and also scans tracked files for an API key. When the changed files can't
  # be determined (first push, force push), everything runs.
  changes:
    name: Which files changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            # Three dots: only what this PR changed, not what main gained since it branched.
            range="origin/$BASE...HEAD"
          else
            # A push: everything since the previous tip of main.
            range="$BEFORE...HEAD"
          fi
          if ! changed="$(git diff --name-only "$range")"; then
            echo "Could not diff $range: running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          if grep -qvE '\.md$|^LICENSE$' <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only Markdown/license files changed: skipping package tests and the app job."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (secrets, swift-format, SwiftLint)
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s "$XCODE_APP"
      - run: command -v swiftlint || brew install swiftlint
      - run: command -v gitleaks || brew install gitleaks
      - run: ios/check.sh lint

  package-tests:
    name: Package tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s "$XCODE_APP"
      - run: ios/check.sh package

  # Build, unit tests and a short UI smoke set. The full UI suite is slow on a CI runner, so it
  # runs locally (`ios/check.sh`) or on demand from the "UI tests (full)" workflow.
  app:
    name: App (build, unit tests, UI smoke tests)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s "$XCODE_APP"
      - id: build
        name: Build for testing
        run: ios/check.sh build
      - name: Unit tests
        run: ios/check.sh unit
      # Runs even if the unit tests failed, so one run shows every failing stage.
      - name: UI smoke tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ios/check.sh smoke
      # Always, and named per attempt: a rerun used to replace the failed attempt's bundle, and
      # a run that timed out or passed on its second try left nothing to look at. The bundles
      # also carry each UI test's step timings, which is how a slow test is found.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: xcresult-attempt-${{ github.run_attempt }}
          path: results/
          retention-days: 7
