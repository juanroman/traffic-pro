name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Xcode 27.2 and the iOS 27.2 simulator exist only on the preview `xcode-27` runner image
  # (its default Xcode is 27.1, so each job selects 27.2 below).
  XCODE_APP: /Applications/Xcode_27.2.app
  RESULTS_DIR: ${{ github.workspace }}/results

jobs:
  lint:
    name: Lint (secrets, swift-format, SwiftLint)
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP" && xcodebuild -version
      - name: Install SwiftLint
        run: command -v swiftlint || brew install swiftlint
      - run: ios/check.sh lint

  package-tests:
    name: Package tests
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP" && xcodebuild -version
      - run: ios/check.sh package

  app:
    name: App (build, unit tests, UI tests)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP" && xcodebuild -version
      - name: Build for testing
        id: build
        run: ios/check.sh build
      - name: Unit tests
        timeout-minutes: 15
        run: ios/check.sh unit
      # Runs even when the unit tests failed, so one run shows every failing stage.
      - name: UI tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 40
        run: ios/check.sh ui
      - name: Upload test results
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult
          path: results/
          retention-days: 7
